<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="harness.css" />
<style>
/* ---- layout B -------------------------------------------------------
   The alternative. Same scene ids as A wherever the scene means the same
   moment, so ] / [ flips between layouts without changing the situation.
   -------------------------------------------------------------------- */

.sc { width: min(980px, 100%); margin: 0 auto; padding: 7vh 28px 120px;
      display: grid; grid-template-columns: 190px 1fr; gap: 34px; }

.sc-rail { display: grid; align-content: start; gap: 18px; }
.sc-clock { font-family: var(--mono); font-size: 2.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
.sc-stat { font-family: var(--mono); font-size: 0.85rem; color: var(--text-secondary); }
.sc-stat.is-met { color: var(--good); }

.sc-body { min-width: 0; }
.sc-title { margin: 0 0 4px; font-size: 1.5rem; font-weight: 620; letter-spacing: -0.01em; }
.sc-crumb { margin: 0 0 24px; color: var(--text-muted); font-size: 0.85rem; }

.sc-list { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 8px; }
.sc-item { display: flex; gap: 12px; align-items: center; padding: 11px 14px;
  border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--card); cursor: pointer; }
.sc-item .box { flex: none; width: 17px; height: 17px; border-radius: 5px;
  border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 0.72rem; color: var(--text-muted); }
.sc-item[data-state="checked"] .box { background: var(--good); border-color: var(--good); color: #10241b; }
.sc-item[data-state="checked"] .box::after { content: "✓"; }
.sc-item[data-state="x"] .box::after { content: "×"; }
.sc-item[data-state="x"] span { color: var(--text-muted); text-decoration: line-through; }

.sc-write { width: 100%; min-height: 200px; resize: vertical; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--border-subtle); background: var(--card); color: var(--text-primary); font: inherit; line-height: 1.6; }
.sc-write:focus { outline: none; border-color: rgba(74, 158, 255, 0.5); }

.sc-gate { margin-top: 18px; font-size: 1.05rem; color: var(--text-secondary); }
.sc-gate.is-clear { color: var(--good); }
.sc-next { margin-top: 14px; padding: 10px 20px; border-radius: 999px;
  border: 1px solid rgba(74, 158, 255, 0.5); background: rgba(74, 158, 255, 0.16);
  color: var(--text-primary); font: inherit; cursor: pointer; }
.sc-next:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--border-strong); background: transparent; }

@keyframes sc-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.is-blinking { animation: sc-blink 900ms ease-in-out infinite; color: var(--bad); }

/* Below 900px the rail is a top bar — the fold every mock should show. */
@media (max-width: 900px) {
  .sc { grid-template-columns: 1fr; gap: 20px; }
  .sc-rail { grid-auto-flow: column; justify-content: start; align-items: baseline; gap: 18px; }
  .sc-clock { font-size: 1.6rem; }
}
</style>
</head>
<body>

<main class="sc">
  <aside class="sc-rail">
    <div class="sc-clock" id="clock">5:00</div>
    <div class="sc-stat" id="count">0 / 20 words</div>
  </aside>

  <section class="sc-body">
    <h1 class="sc-title" id="title">Screen title</h1>
    <p class="sc-crumb" id="crumb">where this sits · what it belongs to</p>

    <ul class="sc-list" id="items">
      <li class="sc-item" data-state="x"><span class="box"></span><span>First thing that was on the list</span></li>
      <li class="sc-item" data-state="x"><span class="box"></span><span>Second thing that was on the list</span></li>
      <li class="sc-item" data-state="x"><span class="box"></span><span>Third thing that was on the list</span></li>
    </ul>

    <textarea class="sc-write" id="write" placeholder="Write here…"></textarea>

    <p class="sc-gate" id="gate">20 more words before this moves.</p>
    <button class="sc-next" id="next" disabled>Next</button>
  </section>
</main>

<script src="mockups.config.js"></script>
<script src="harness.js"></script>
<script>
const mock = {
  clock(text, blink = false) {
    const el = document.getElementById('clock');
    el.textContent = text;
    el.classList.toggle('is-blinking', blink);
  },
  words(n, target = 20) {
    const el = document.getElementById('count');
    el.textContent = `${n} / ${target} words`;
    el.classList.toggle('is-met', n >= target);
  },
  text(s) { document.getElementById('write').value = s; },
  item(i, state) { const el = document.querySelectorAll('.sc-item')[i]; if (el) el.dataset.state = state; },
  gate(text, clear = false) {
    const el = document.getElementById('gate');
    el.textContent = text;
    el.classList.toggle('is-clear', clear);
  },
  ready(on = true) { document.getElementById('next').disabled = !on; },
};

const SCENES = {
  fresh() {},

  working() {
    mock.clock('3:04');
    mock.item(1, 'checked');
    mock.text('Two of the four are gone. The third is photographed but not listed, '
      + 'and that is the one that actually moves money.');
    mock.words(24);
    mock.gate('Everything here is done.', true);
    mock.ready(true);
  },

  warning() {
    mock.clock('0:24', true);
    mock.text('Two of the four are gone.');
    mock.words(6);
    mock.gate('14 more words, and 24 seconds to write them.');
  },
};

document.getElementById('items').addEventListener('click', (e) => {
  const item = e.target.closest('.sc-item');
  if (item) item.dataset.state = item.dataset.state === 'checked' ? 'x' : 'checked';
});

Mockup.boot({ variant: 'b', scenes: SCENES });
document.getElementById('write').focus({ preventScroll: true });
</script>
</body>
</html>
